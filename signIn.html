<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body class="signIn">
    <h1 class="register">Registration</h1>
    <div class="signbox">
        <label for="fullname">Name</label>
        <input type="text" id="fullname">
        <label for="email">Email</label>
        <input type="text" id="email">
        <label for="username">Username</label>
        <input type="text" id="username" class="uname">
        <label for="password">Password</label>
        <input type="password" id="password" class="pass">
        <input type="file" id="upload" class="fileUpload" placeholder="Insert info here">
    </div>
    <button class="regbtn">Register</button>
</body>
</html>
